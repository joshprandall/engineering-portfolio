<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Diagnostic</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#0b0f14;color:#f4f7fb;margin:0;padding:24px;line-height:1.45}
main{max-width:760px;margin:auto}
button{font:inherit;font-weight:700;padding:14px 18px;margin:6px 6px 6px 0;border-radius:12px;border:1px solid #667;background:#18212b;color:#fff}
pre{white-space:pre-wrap;background:#111821;padding:16px;border-radius:12px;border:1px solid #39424e}
.ok{color:#7dff9b}.bad{color:#ff8b8b}
</style>
</head>
<body>
<main>
<h1>Portfolio audio diagnostic</h1>
<p>This page does not use the website audio controller. Each button directly plays one local MP3 through one native HTML audio element.</p>
<div>
<button data-key="dark">Play dark music</button>
<button data-key="river">Play river</button>
<button data-key="waterfall">Play waterfall</button>
<button data-key="beach">Play beach + birds</button>
<button id="stop">Stop</button>
</div>
<pre id="log">Loading diagnostics…</pre>
<audio id="player" controls playsinline preload="metadata" style="width:100%;margin-top:16px"></audio>
</main>
<script>
const files={
 dark:'assets/audio/dark-theme.mp3',
 river:'assets/audio/river.mp3',
 waterfall:'assets/audio/waterfall.mp3',
 beach:'assets/audio/beach.mp3'
};
const log=document.querySelector('#log');
const player=document.querySelector('#player');
const lines=[];
function write(s,cls=''){lines.push(s);log.textContent=lines.join('\n');}
function errName(code){return ({1:'MEDIA_ERR_ABORTED',2:'MEDIA_ERR_NETWORK',3:'MEDIA_ERR_DECODE',4:'MEDIA_ERR_SRC_NOT_SUPPORTED'})[code]||String(code||'none');}
async function head(key,url){
 try{
  const r=await fetch(url,{method:'HEAD',cache:'no-store'});
  write(key+': HTTP '+r.status+' | '+(r.headers.get('content-type')||'no content-type')+' | '+(r.headers.get('content-length')||'no content-length')+' bytes');
 }catch(e){write(key+': HEAD ERROR '+e);}
}
(async()=>{
 lines.length=0;
 write('User agent: '+navigator.userAgent);
 write('canPlay audio/mpeg: '+player.canPlayType('audio/mpeg'));
 write('');
 for(const [k,u] of Object.entries(files)) await head(k,u);
 write('');
 write('Tap a Play button. If it works here, the MP3/server are good and the bug is in the site controller.');
})();
player.addEventListener('loadedmetadata',()=>write('loadedmetadata: '+player.currentSrc+' duration='+player.duration.toFixed(2)+'s'));
player.addEventListener('playing',()=>write('PLAYING: '+player.currentSrc+' time='+player.currentTime.toFixed(2)));
player.addEventListener('pause',()=>write('PAUSED: '+player.currentSrc+' time='+player.currentTime.toFixed(2)));
player.addEventListener('error',()=>write('AUDIO ERROR: '+errName(player.error?.code)+' message='+(player.error?.message||'')));
player.addEventListener('stalled',()=>write('STALLED: '+player.currentSrc));
player.addEventListener('waiting',()=>write('WAITING: '+player.currentSrc));
document.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',async()=>{
 const key=btn.dataset.key;
 player.pause();
 player.src=files[key]+'?t='+Date.now();
 player.load();
 try{
  await player.play();
  write('play() resolved for '+key);
 }catch(e){
  write('play() REJECTED for '+key+': '+e.name+' — '+e.message);
 }
}));
document.querySelector('#stop').addEventListener('click',()=>player.pause());
</script>
</body>
</html>
