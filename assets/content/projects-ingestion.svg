<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
  <title id="title">Inventory ingestion decision diagram</title>
  <desc id="desc">An exported batch is validated, written to an in-memory transaction with its request digest, then either committed together or rolled back together on error. Repeated request keys require the same payload.</desc>
  <rect width="960" height="290" rx="24" fill="#0b1a2d"/>
  <g font-family="system-ui,sans-serif" fill="#effaff" text-anchor="middle" font-size="18">
    <rect x="34" y="88" width="180" height="105" rx="14" fill="#16465a" stroke="#67dce5"/><text x="124" y="130">Exported batch</text><text x="124" y="158" font-size="14">id · owner · count</text>
    <rect x="270" y="88" width="180" height="105" rx="14" fill="#16465a" stroke="#67dce5"/><text x="360" y="130">Validate all</text><text x="360" y="158" font-size="14">schema · IDs · types</text>
    <rect x="506" y="88" width="180" height="105" rx="14" fill="#16465a" stroke="#67dce5"/><text x="596" y="130">One transaction</text><text x="596" y="158" font-size="14">rows + key digest</text>
    <rect x="742" y="88" width="180" height="105" rx="14" fill="#16465a" stroke="#67dce5"/><text x="832" y="130">Commit or undo</text><text x="832" y="158" font-size="14">whole batch</text>
  </g>
  <path d="M215 140h44m192 0h44m192 0h44" stroke="#8ce8e7" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#8ce8e7"/></marker></defs>
  <text x="480" y="50" fill="#a6e8e9" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19">Teaching companion: atomic ingestion and safe replay</text>
  <text x="480" y="245" fill="#bfd3df" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">Same key + changed payload → reject; injected error → rollback</text>
</svg>
