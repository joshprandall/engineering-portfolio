<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">A scientific learning loop</title>
  <desc id="desc">Four boxes in order: predict from a model, run a controlled check, compare with evidence, revise the model. An arrow returns to prediction.</desc>
  <rect width="960" height="340" rx="24" fill="#10212c"/>
  <g fill="#213f50" stroke="#8cc8d1" stroke-width="3">
    <rect x="40" y="88" width="188" height="118" rx="17"/>
    <rect x="270" y="88" width="188" height="118" rx="17"/>
    <rect x="500" y="88" width="188" height="118" rx="17"/>
    <rect x="730" y="88" width="188" height="118" rx="17"/>
  </g>
  <g fill="#f4f8f9" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="134" y="137" font-size="23" font-weight="700">Predict</text><text x="134" y="170" font-size="16">state an expected result</text>
    <text x="364" y="137" font-size="23" font-weight="700">Test</text><text x="364" y="170" font-size="16">change one input</text>
    <text x="594" y="137" font-size="23" font-weight="700">Compare</text><text x="594" y="170" font-size="16">inspect the evidence</text>
    <text x="824" y="137" font-size="23" font-weight="700">Revise</text><text x="824" y="170" font-size="16">explain the mismatch</text>
  </g>
  <g fill="none" stroke="#e6bb67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M233 147h28m-10-10 10 10-10 10M463 147h28m-10-10 10 10-10 10M693 147h28m-10-10 10 10-10 10"/>
    <path d="M824 217v64H134v-64m-10 10 10-10 10 10"/>
  </g>
  <text x="480" y="316" fill="#f4f8f9" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Repeat with a stronger prediction; record assumptions and limitations.</text>
</svg>
