<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Virtual path boundary: vulnerable and bounded resolvers</title>
  <desc id="desc">A synthetic relative path is normalized. Without containment validation it crosses the virtual public-root boundary. With validation it is rejected before any file access.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c34"/><stop offset="1" stop-color="#132d3d"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#99cbd7"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#e8f5f6}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2px;fill:#88dbe7}
      .head{font-size:27px;font-weight:750}
      .label{font-size:17px;font-weight:700}
      .small{font-size:14px;fill:#c9dce3}
      .path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px;fill:#f8f7e9}
    </style>
  </defs>
  <rect width="960" height="480" rx="20" fill="url(#bg)"/>
  <text class="kicker" x="42" y="50">SYNTHETIC LAB CASE</text>
  <text class="head" x="42" y="91">The boundary must survive normalization</text>
  <rect x="42" y="125" width="278" height="75" rx="12" fill="#25455c" stroke="#76c9df" stroke-width="2"/>
  <text class="small" x="62" y="151">Requester-controlled path</text>
  <text class="path" x="62" y="180">../lab-secret.txt</text>
  <path d="M320 163H380" stroke="#99cbd7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="392" y="125" width="280" height="75" rx="12" fill="#25455c" stroke="#76c9df" stroke-width="2"/>
  <text class="label" x="412" y="155">Normalize relative path</text>
  <text class="small" x="412" y="182">Root: /srv/app/public</text>
  <path d="M672 163H733" stroke="#99cbd7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="745" y="125" width="172" height="75" rx="12" fill="#25455c" stroke="#76c9df" stroke-width="2"/>
  <text class="label" x="762" y="155">Root check?</text>
  <text class="small" x="762" y="182">After resolution</text>
  <path d="M831 200V259" stroke="#f0a18c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M785 200V365H651" stroke="#91e0b5" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="520" y="273" width="397" height="78" rx="12" fill="#503241" stroke="#f0a18c" stroke-width="2"/>
  <text class="label" x="540" y="303">No check: outside root</text>
  <text class="small" x="540" y="328">Modeled escape reaches virtual secret</text>
  <rect x="42" y="365" width="596" height="78" rx="12" fill="#204b4a" stroke="#91e0b5" stroke-width="2"/>
  <text class="label" x="62" y="395">Containment check: reject the escape</text>
  <text class="small" x="62" y="420">Preserve allowed in-root paths as the negative control</text>
  <text class="small" x="42" y="463">Model only · no real files, hosts, or network requests</text>
</svg>
