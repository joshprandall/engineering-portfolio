name: Crown & Ash Combat Choreography

on:
  pull_request:
    paths:
      - "games/3d-battle-chess/combat-v8/**"
      - "tests/chess-combat-choreography.test.mjs"
      - ".github/workflows/crown-and-ash-combat.yml"

jobs:
  combat-choreography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check combat module syntax
        run: |
          node --check games/3d-battle-chess/combat-v8/combat-director.js
          node --check games/3d-battle-chess/combat-v8/defense-choreography.js
          node --check games/3d-battle-chess/combat-v8/defeat-choreography.js

      - name: Verify living battle choreography
        run: node tests/chess-combat-choreography.test.mjs
