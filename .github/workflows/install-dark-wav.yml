name: Install dark WAV master

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-dark-wav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and commit seamless WAV
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f assets/audio/dark-theme-user.wav ]]; then
            echo "WAV already exists; nothing to do."
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

          ffmpeg -y -hide_banner -loglevel error             -i assets/audio/dark-theme-user.mp3             -vn -ar 44100 -ac 2 -c:a pcm_s16le /tmp/dark-source.wav

          python3 - <<'PY'
          import array, math, sys, wave
          from pathlib import Path

          source = Path("/tmp/dark-source.wav")
          target = Path("assets/audio/dark-theme-user.wav")

          # Beat-aligned loop recipe used for the accepted smooth master:
          # source start = 1.184217687 s (52,224 samples)
          # raw phrase   = 18.459863946 s (814,080 samples)
          # circular equal-power crossfade = 1.44 s (63,504 samples)
          start = 52224
          raw_frames = 814080
          fade_frames = 63504
          out_frames = raw_frames - fade_frames

          with wave.open(str(source), "rb") as src:
              if src.getframerate() != 44100 or src.getnchannels() != 2 or src.getsampwidth() != 2:
                  raise SystemExit("Unexpected decoded source format")
              params = src.getparams()
              samples = array.array("h")
              samples.frombytes(src.readframes(src.getnframes()))

          channels = 2
          required = (start + raw_frames) * channels
          if len(samples) < required:
              raise SystemExit(f"Source too short: {len(samples)//channels} frames")

          out = array.array("h", samples[start*channels:(start+out_frames)*channels])

          # Circular crossfade lives at the beginning: the final 1.44 s of the
          # raw phrase fades into its first 1.44 s. The unmodified phrase then
          # continues, so the final sample flows naturally back into frame zero.
          for frame in range(fade_frames):
              x = frame / fade_frames
              fade_in = math.sin(x * math.pi / 2.0) ** 2
              fade_out = 1.0 - fade_in
              head_base = (start + frame) * channels
              tail_base = (start + out_frames + frame) * channels
              out_base = frame * channels
              for ch in range(channels):
                  value = math.floor(
                      samples[tail_base + ch] * fade_out +
                      samples[head_base + ch] * fade_in
                  )
                  out[out_base + ch] = max(-32768, min(32767, value))

          target.parent.mkdir(parents=True, exist_ok=True)
          with wave.open(str(target), "wb") as dst:
              dst.setnchannels(2)
              dst.setsampwidth(2)
              dst.setframerate(44100)
              dst.writeframes(out.tobytes())

          expected_frames = 750576
          with wave.open(str(target), "rb") as check:
              assert check.getframerate() == 44100
              assert check.getnchannels() == 2
              assert check.getsampwidth() == 2
              assert check.getnframes() == expected_frames
          print(f"Created {target} with {expected_frames} frames ({expected_frames/44100:.6f}s)")
          PY

          ls -lh assets/audio/dark-theme-user.wav
          sha256sum assets/audio/dark-theme-user.wav

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/dark-theme-user.wav
          git commit -m "Add seamless WAV master for dark mode"
          git push
