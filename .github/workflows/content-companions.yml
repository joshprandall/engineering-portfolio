name: Authored content companions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: python -m pip install numpy==2.3.5 nbformat nbclient ipykernel
      - run: python -m unittest discover -s project-sources/engineering-studies -p 'test_*.py'
      - run: python tools/check_content_notebooks.py engineering-foundations engineering-studies
      - run: node --test tests/content-experiments.test.cjs tests/study-companions.test.cjs
      - run: python tools/restore_website2_assets.py --ambience
      # Hosted runners normally provide Google Chrome. Use it before downloading
      # Chromium; avoid unnecessary apt dependencies and transient Ubuntu mirror DNS.
      # If Chrome is absent, install only the Playwright-managed browser (not apt).
      - name: Select available browser for content QA
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$CHROME" ]; then
            echo "PORTFOLIO_BROWSER_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
            echo "Using installed runner Chrome: $CHROME"
          else
            echo "No preinstalled Chrome; downloading Playwright Chromium"
            npx playwright install chromium
          fi
      - run: node tests/content-browser.test.cjs
        env:
          PORTFOLIO_RUNTIME_ROOT: .
          PORTFOLIO_QA_DIR: visual-qa/content
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authored-content-browser
          path: visual-qa/content/
