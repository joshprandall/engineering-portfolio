name: Authored content companions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: python -m pip install numpy==2.3.5 nbformat nbclient ipykernel
      - run: python -m unittest discover -s project-sources/engineering-studies -p 'test_*.py'
      - run: python tools/check_content_notebooks.py engineering-foundations engineering-studies
      - run: node --check coding-lab.js && node --check quantum-lab.js && node --check ai-engineering-tools.js && node --check security-extended.js && node --check game-engine-tools.js && node --check projects-evidence.js
      - run: node --test tests/content-experiments.test.cjs tests/study-companions.test.cjs tests/knowledge-expansion.test.cjs
      - run: python tools/restore_website2_assets.py --ambience
      - run: npx playwright install --with-deps chromium
      - run: node tests/content-browser.test.cjs
        env:
          PORTFOLIO_RUNTIME_ROOT: .
          PORTFOLIO_QA_DIR: visual-qa/content
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authored-content-browser
          path: visual-qa/content/
