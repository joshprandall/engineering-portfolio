name: Crown & Ash Accessibility

on:
  pull_request:
    paths:
      - "games/3d-battle-chess/**"
      - "tests/chess-accessibility.test.cjs"
      - ".github/workflows/crown-and-ash-accessibility.yml"
  workflow_dispatch:

jobs:
  accessibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh pinned offline Three.js bundle
        run: npm run vendor:crown-ash

      - name: Verify Basic Edition accessibility and keyboard play
        env:
          PORTFOLIO_RUNTIME_ROOT: ${{ github.workspace }}
          PORTFOLIO_BROWSER_EXECUTABLE: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: node tests/chess-accessibility.test.cjs
