name: Crown & Ash Release

on:
  push:
    branches:
      - ai/crown-and-ash-productization
      - ai/crown-and-ash-release-hardening
    paths:
      - "games/3d-battle-chess/**"
      - "products/crown-and-ash-desktop/**"
      - "tests/chess-*.cjs"
      - "tests/chess-*.mjs"
      - "tools/vendor-crown-ash.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/crown-and-ash-release.yml"
  pull_request:
    paths:
      - "games/3d-battle-chess/**"
      - "products/crown-and-ash-desktop/**"
      - "tests/chess-*.cjs"
      - "tests/chess-*.mjs"
      - "tools/vendor-crown-ash.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/crown-and-ash-release.yml"

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install game test dependencies
        run: npm ci

      - name: Refresh pinned offline Three.js bundle
        run: npm run vendor:crown-ash

      - name: Verify chess rules
        run: node tests/chess-rules.test.mjs

      - name: Verify productization contract
        run: node tests/chess-productization.test.mjs

      - name: Verify 30-character roster integrity
        run: node tests/chess-roster-integrity.test.mjs

      - name: Verify faction audio behavior
        run: node tests/chess-audio.test.mjs

      - name: Verify Xbox and PlayStation-compatible controller behavior
        env:
          PORTFOLIO_RUNTIME_ROOT: ${{ github.workspace }}
          PORTFOLIO_BROWSER_EXECUTABLE: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: node tests/chess-controller.test.cjs

      - name: Verify complete browser gameplay
        env:
          PORTFOLIO_RUNTIME_ROOT: ${{ github.workspace }}
          PORTFOLIO_BROWSER_EXECUTABLE: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: node tests/chess-browser.test.cjs

      - name: Install desktop packaging dependencies
        working-directory: products/crown-and-ash-desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: products/crown-and-ash-desktop
        run: npm run dist:win

      - name: Smoke-test packaged Windows runtime
        working-directory: products/crown-and-ash-desktop
        shell: pwsh
        env:
          CROWN_ASH_SMOKE: "1"
        run: |
          $exe = Get-ChildItem -Path "dist/win-unpacked" -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "^(elevate|Uninstall)" } |
            Select-Object -First 1
          if (-not $exe) {
            throw "Packaged Crown & Ash executable not found in dist/win-unpacked."
          }

          Write-Host "Launching packaged smoke target: $($exe.FullName)"
          $process = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $process.WaitForExit(45000)) {
            try { $process.Kill($true) } catch {}
            throw "Packaged Crown & Ash smoke test timed out after 45 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Crown & Ash smoke test failed with exit code $($process.ExitCode)."
          }

          Write-Host "Packaged Crown & Ash smoke test passed."

      - name: Upload unsigned Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: crown-and-ash-windows-unsigned
          path: products/crown-and-ash-desktop/dist/Crown-and-Ash-*-x64.exe
          if-no-files-found: error
