name: Build OSU science-safe overlay

on:
  push:
    branches: [site-v1-1-knowledge-sync, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Validate reconciled website
        run: npm test
      - name: Verify protected experiences remain complete in source
        run: |
          for file in index.html styles.css engine.js battle.js CREDITS.md; do
            test -s "games/3d-battle-chess/$file" || { echo "Missing $file in protected browser chess build"; exit 1; }
          done
          # Evil Wizard's browser export is intentionally OSU-host-only and is not required in GitHub.
          test -s geometric-lab/index.html
          test -s project-battle-chess.html
          test -s project-geometric-ai.html
          test -s play-evil-wizard.html
          ! grep -q 'games/battle-chess/' project-battle-chess.html
      - name: Create protected-experience-preserving website overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path('.')
          protected_root = set()
          theme_shell = {'geometric-lab/index.html', 'geometric-lab/app.js'}
          top = sorted(
              p for p in root.iterdir()
              if p.is_file()
              and p.suffix.lower() in {'.html','.css','.js','.mjs'}
              and p.name not in protected_root
          )
          include = top + [root/'verification-manifest.json',root/'learning-capstones.json'] + [root/name for name in theme_shell]
          for folder in ('deep-learning','labs','qubit-preview-20260921','assets'):
              include.extend(p for p in (root/folder).rglob('*') if p.is_file())

          instructions = (root/'DEPLOYMENT.md').read_text(encoding='utf-8')
          instructions += (
              '\nIMPORTANT: This science-safe overlay intentionally excludes all game trees, '
              'the Geometry Lab calculation modules, the OSU-only Evil Wizard game export, '
              'and the fusion video. Only the Geometry Lab index.html and app.js shell are included for shared appearance. Merge it into the existing '
              'public_html; never delete the existing public_html directory or protected trees.\n'
          )

          output = 'Joshua_Randall_OSU_Science_Safe_Overlay.zip'
          with ZipFile(output,'w',ZIP_DEFLATED,compresslevel=7) as archive:
              for file in sorted(set(include)):
                  archive.write(file,file.as_posix())
              archive.writestr('DEPLOYMENT_READ_FIRST.txt',instructions)

          with ZipFile(output) as archive:
              names=set(archive.namelist())
              required=theme_shell | {
                  'site-theme.js','site-scenes.js','site-scenes.css',
                  'assets/scenes/webb-cosmic-cliffs.webp','assets/scenes/mountain-valley.svg',
                  'index.html','projects.html','portfolio-next.js','portfolio-next.css',
                  'handheld-experience.js','handheld-experience.css',
                  'science-experiments.js','science-experiments.css',
                  'knowledge.js','learning-depth.js','learning-depth.css','learning-capstones.json',
                  'portfolio-home.css','quantum-cube.js','assets/fonts/fonts.css',
                  'assets/joshua-randall-headshot.jpg', 'assets/joshua-randall-cutout.webp', 'assets/mit-logo.svg','assets/systems-lab.jpg','assets/quantum-field-notes.jpg',
                  'agent-workbench.js','labs/qpe.js','labs/emergent.js',
                  'qubit-preview-20260921/index.html',
                  'qubit-preview-20260921/app.js',
                  'qubit-preview-20260921/qubit.js',
              }
              missing=sorted(required-names)
              if missing:
                  raise SystemExit('Overlay missing required science files: '+', '.join(missing))
              forbidden_prefixes=('games/','geometric-lab/')
              forbidden_exact=protected_root | {'assets/fusion-presentation.mp4'}
              forbidden=sorted(
                  n for n in names
                  if (n.startswith(forbidden_prefixes) and n not in theme_shell) or n in forbidden_exact
              )
              if forbidden:
                  raise SystemExit('Overlay unexpectedly contains protected files: '+', '.join(forbidden))
          print(f'Science-safe overlay packaged: {len(set(include))} website files; games and Geometry Lab calculation modules are protected by omission.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: joshua-randall-osu-science-safe-overlay
          path: Joshua_Randall_OSU_Science_Safe_Overlay.zip
          if-no-files-found: error
          retention-days: 30
      - name: Exercise responsive navigation and interactive projects
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then npx playwright install --with-deps chromium; fi
          PORTFOLIO_BROWSER_EXECUTABLE="$CHROME" PORTFOLIO_QA_DIR=visual-qa npm run test:browser
      - name: Capture optional desktop and phone-sized screenshots
        shell: bash
        run: |
          mkdir -p visual-qa
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-server.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then echo 'No Chrome binary available; screenshots unavailable'; exit 0; fi
          LEARN_DOM=$(timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8500 --dump-dom "http://127.0.0.1:8765/learn.html" 2>/dev/null || true)
          grep -Fq 'id="learning-depth"' <<< "$LEARN_DOM" || { echo 'Rendered Learn page is missing the progressive mastery ladder'; exit 1; }
          grep -Fq 'Doctoral / Research' <<< "$LEARN_DOM" || { echo 'Rendered Learn page is missing the research-depth target'; exit 1; }
          PATH_DOM=$(timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8500 --dump-dom "http://127.0.0.1:8765/learn-paths.html?targetDepth=research" 2>/dev/null || true)
          grep -Fq 'id="vnext-path-band"' <<< "$PATH_DOM" || { echo 'Rendered Paths page is missing mastery-aware band filtering'; exit 1; }
          grep -Fq 'Doctoral / Research' <<< "$PATH_DOM" || { echo 'Rendered Paths page did not inherit the research target'; exit 1; }
          if grep -Fq 'id="learning-depth"' <<< "$PATH_DOM"; then echo 'Paths page must not render the full Learn-home mastery section'; exit 1; fi
          for page in index.html projects.html learn.html learn-paths.html qubit-preview-20260921/index.html games/3d-battle-chess/index.html geometric-lab/index.html; do
            name=$(echo "$page" | tr '/.' '--')
            timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=8500 --window-size=390,844 --screenshot="visual-qa/${name}-phone.png" "http://127.0.0.1:8765/$page" >/dev/null 2>&1 || echo "Phone screenshot unavailable for $page"
            timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=8500 --window-size=1440,900 --screenshot="visual-qa/${name}-desktop.png" "http://127.0.0.1:8765/$page" >/dev/null 2>&1 || echo "Desktop screenshot unavailable for $page"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joshua-randall-site-visual-qa
          path: visual-qa/
          if-no-files-found: ignore
          retention-days: 30
