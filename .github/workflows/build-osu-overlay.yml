name: Build reconciled OSU overlay

on:
  push:
    branches: [site-v1-1-knowledge-sync, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reconciled website
        run: npm test
      - name: Verify complete browser chess files
        run: |
          for file in index.html styles.css engine.js battle.js CREDITS.md; do
            test -s "games/3d-battle-chess/$file" || { echo "Missing $file in complete browser chess build"; exit 1; }
          done
          ! grep -q 'games/battle-chess/' project-battle-chess.html
      - name: Create backup-preserving website overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('.')
          top = sorted(p for p in root.iterdir() if p.is_file() and p.suffix.lower() in {'.html','.css','.js','.mjs'})
          include = top + [root/'verification-manifest.json']
          for folder in ('deep-learning','geometric-lab','games/3d-battle-chess','labs','qubit-preview-20260921','assets'):
              include.extend(p for p in (root/folder).rglob('*') if p.is_file())
          instructions = (root/'DEPLOYMENT.md').read_text(encoding='utf-8')
          instructions += '\nIMPORTANT: This overlay contains the complete separately sourced 3D Battle Chess game but does not contain games/evil-wizard/index.html or the fusion video. Preserve and verify those OSU-only files; do not delete the existing public_html directory.\n'
          with ZipFile('Joshua_Randall_OSU_Reconciled_Site_Overlay.zip','w',ZIP_DEFLATED,compresslevel=7) as archive:
              for file in sorted(set(include)):
                  archive.write(file,file.as_posix())
              archive.writestr('DEPLOYMENT_READ_FIRST.txt',instructions)
          print(f'Overlay packaged: {len(set(include))} website files including complete 3D Battle Chess; Evil Wizard export and fusion video require existing OSU assets.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: joshua-randall-osu-site-overlay
          path: Joshua_Randall_OSU_Reconciled_Site_Overlay.zip
          if-no-files-found: error
          retention-days: 30
      - name: Capture optional desktop and phone-sized screenshots
        shell: bash
        run: |
          mkdir -p visual-qa
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-server.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then echo 'No Chrome binary available; screenshots unavailable'; exit 0; fi
          for page in index.html projects.html learn.html qubit-preview-20260921/index.html games/3d-battle-chess/index.html; do
            name=$(echo "$page" | tr '/.' '--')
            timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=8500 --window-size=390,844 --screenshot="visual-qa/${name}-phone.png" "http://127.0.0.1:8765/$page" >/dev/null 2>&1 || echo "Phone screenshot unavailable for $page"
            timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=8500 --window-size=1440,900 --screenshot="visual-qa/${name}-desktop.png" "http://127.0.0.1:8765/$page" >/dev/null 2>&1 || echo "Desktop screenshot unavailable for $page"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: joshua-randall-site-visual-qa
          path: visual-qa/
          if-no-files-found: ignore
          retention-days: 30
