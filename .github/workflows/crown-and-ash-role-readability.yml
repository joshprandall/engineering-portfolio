name: Crown & Ash Role Readability

on:
  pull_request:
    paths:
      - "games/3d-battle-chess/combat-v8/character-visuals.js"
      - "games/3d-battle-chess/combat-v8/character-factory.js"
      - "tests/chess-role-readability.test.mjs"
      - ".github/workflows/crown-and-ash-role-readability.yml"
  workflow_dispatch:

jobs:
  role-silhouettes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify geometry-based chess role readability
        run: node tests/chess-role-readability.test.mjs
