name: Crown & Ash Controller Focus

on:
  pull_request:
    paths:
      - "games/3d-battle-chess/**"
      - "tests/chess-controller-focus.test.cjs"
      - ".github/workflows/crown-and-ash-controller-focus.yml"
  push:
    branches:
      - "ai/crown-and-ash-controller-focus-20261005-r2"
    paths:
      - "games/3d-battle-chess/**"
      - "tests/chess-controller-focus.test.cjs"
      - ".github/workflows/crown-and-ash-controller-focus.yml"

jobs:
  controller-ui-focus:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install game test dependencies
        run: npm ci
      - name: Refresh pinned offline Three.js bundle
        run: npm run vendor:crown-ash
      - name: Verify controller-only setup, menus, promotion and results
        env:
          PORTFOLIO_RUNTIME_ROOT: ${{ github.workspace }}
          PORTFOLIO_BROWSER_EXECUTABLE: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: node tests/chess-controller-focus.test.cjs
