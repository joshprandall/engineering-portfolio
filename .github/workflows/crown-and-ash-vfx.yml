name: Crown & Ash Combat VFX

on:
  pull_request:
    paths:
      - "games/3d-battle-chess/combat-v8/effects.js"
      - "tests/chess-combat-vfx.test.mjs"
      - ".github/workflows/crown-and-ash-vfx.yml"

jobs:
  verify-vfx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check VFX module syntax
        run: node --check games/3d-battle-chess/combat-v8/effects.js

      - name: Verify combat VFX envelopes
        run: node tests/chess-combat-vfx.test.mjs
