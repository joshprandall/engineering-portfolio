name: Crown & Ash Controller Gate

on:
  pull_request:
    paths:
      - "games/3d-battle-chess/**"
      - "tests/chess-controller.test.cjs"
      - ".github/workflows/crown-and-ash-controller.yml"
  push:
    branches:
      - "ai/crown-and-ash-controller-gate-20261004"
    paths:
      - "games/3d-battle-chess/**"
      - "tests/chess-controller.test.cjs"
      - ".github/workflows/crown-and-ash-controller.yml"

jobs:
  controller-behavior:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install game test dependencies
        run: npm ci
      - name: Refresh pinned offline Three.js bundle
        run: npm run vendor:crown-ash
      - name: Verify Xbox and PlayStation-compatible controller behavior
        env:
          PORTFOLIO_RUNTIME_ROOT: ${{ github.workspace }}
          PORTFOLIO_BROWSER_EXECUTABLE: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: node tests/chess-controller.test.cjs
